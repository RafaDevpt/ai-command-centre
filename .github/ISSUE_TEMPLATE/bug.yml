name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.4.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Chat, Sessions, Projects, Agents, Team, Approvals, Settings, Codex, Claude Code, Ollama, Installation]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Remove hostnames, IP addresses, e-mail addresses, tokens and credentials first.
      render: text
