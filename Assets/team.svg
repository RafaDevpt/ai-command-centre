<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="How the team works: your goal goes to a coordinator, who assigns sub-tasks to Claude Code, Codex and a local model; their results go to a shared board, which the coordinator reviews before writing the final answer. Risky actions wait for your approval.">
  <title>How the team works</title>
  <!-- Created by Redfox using Claude -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#151026"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".06"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
  </defs>
  <rect width="1200" height="440" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="20" fill="url(#dots)"/>
  <g font-family="Segoe UI,Inter,system-ui,sans-serif" text-anchor="middle">
    <!-- step labels -->
    <g font-size="15" font-weight="700" letter-spacing="2.5" fill="#64748b">
      <text x="110" y="42">1 · GOAL</text><text x="345" y="42">2 · PLAN</text>
      <text x="610" y="42">3 · WORK IN PARALLEL</text><text x="860" y="42">4 · SHARE</text><text x="1085" y="42">5 · RESULT</text>
    </g>
    <!-- goal -->
    <rect x="30" y="182" width="160" height="76" rx="38" fill="#0f2420" stroke="#2dd4bf" stroke-width="2"/>
    <text x="110" y="228" font-size="23" font-weight="700" fill="#f1f5f9">Your goal</text>
    <line x1="192" y1="220" x2="244" y2="220" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
    <!-- coordinator -->
    <rect x="248" y="160" width="195" height="120" rx="16" fill="#1a1430" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="345" y="210" font-size="24" font-weight="800" fill="#f1f5f9">Coordinator</text>
    <text x="345" y="240" font-size="17" fill="#c4b5fd">plans · assigns</text>
    <text x="345" y="262" font-size="17" fill="#c4b5fd">reviews</text>
    <!-- fan out -->
    <path d="M445 200 C470 200 470 100 506 100" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/>
    <line x1="445" y1="220" x2="506" y2="220" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/>
    <path d="M445 240 C470 240 470 340 506 340" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/>
    <!-- members -->
    <rect x="510" y="66" width="200" height="72" rx="14" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
    <text x="610" y="98" font-size="21" font-weight="700" fill="#f1f5f9">Claude Code</text>
    <text x="610" y="124" font-size="16" fill="#94a3b8">writes and checks code</text>
    <rect x="510" y="184" width="200" height="72" rx="14" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
    <text x="610" y="216" font-size="21" font-weight="700" fill="#f1f5f9">Codex</text>
    <text x="610" y="242" font-size="16" fill="#94a3b8">analysis and code</text>
    <rect x="510" y="302" width="200" height="72" rx="14" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
    <text x="610" y="334" font-size="21" font-weight="700" fill="#f1f5f9">Local model</text>
    <text x="610" y="360" font-size="16" fill="#94a3b8">quick, simple tasks</text>
    <!-- fan in -->
    <path d="M712 102 C740 102 740 200 776 200" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="712" y1="220" x2="776" y2="220" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M712 338 C740 338 740 240 776 240" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
    <!-- board -->
    <rect x="780" y="160" width="160" height="120" rx="16" fill="#0b1a24" stroke="#94a3b8" stroke-width="2"/>
    <text x="860" y="206" font-size="21" font-weight="700" fill="#f1f5f9">Shared</text>
    <text x="860" y="232" font-size="21" font-weight="700" fill="#f1f5f9">board</text>
    <text x="860" y="260" font-size="15" fill="#94a3b8">+ memory</text>
    <!-- review loop -->
    <path d="M860 282 L860 400 Q860 414 846 414 L359 414 Q345 414 345 400 L345 284" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ap)"/>
    <rect x="525" y="400" width="170" height="28" rx="14" fill="#151026"/>
    <text x="610" y="420" font-size="16" font-weight="600" fill="#c4b5fd">review · more work?</text>
    <!-- outcomes -->
    <line x1="942" y1="205" x2="994" y2="170" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#at)"/>
    <rect x="998" y="132" width="176" height="70" rx="35" fill="#0f2420" stroke="#2dd4bf" stroke-width="2"/>
    <text x="1086" y="175" font-size="20" font-weight="700" fill="#99f6e4">Final answer</text>
    <line x1="942" y1="240" x2="994" y2="276" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#aa)"/>
    <rect x="998" y="246" width="176" height="80" rx="16" fill="#241a0b" stroke="#f59e0b" stroke-width="2"/>
    <text x="1086" y="280" font-size="18" font-weight="700" fill="#fde68a">Risky action?</text>
    <text x="1086" y="306" font-size="16" fill="#fcd34d">waits for you</text>
  </g>
</svg>
