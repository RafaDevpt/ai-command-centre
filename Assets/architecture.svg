<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Architecture: a browser or phone reaches the app through an SSH tunnel or Tailscale. Inside the Docker Compose project, the app talks to PostgreSQL and to an isolated Codex container over Unix sockets. On the host, it talks to the existing Ollama install and to an optional Claude Code runner.">
  <title>Architecture</title>
  <!-- Created by Redfox using Claude -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#151026"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".06"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#dots)"/>
  <g font-family="Segoe UI,Inter,system-ui,sans-serif" text-anchor="middle">
    <!-- client -->
    <rect x="30" y="170" width="190" height="80" rx="40" fill="#0f2420" stroke="#2dd4bf" stroke-width="2"/>
    <text x="125" y="205" font-size="21" font-weight="700" fill="#f1f5f9">Browser</text>
    <text x="125" y="231" font-size="16" fill="#99f6e4">PC · phone (PWA)</text>
    <line x1="222" y1="210" x2="330" y2="210" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="276" y="192" font-size="14" fill="#94a3b8">SSH tunnel</text>
    <text x="276" y="236" font-size="14" fill="#94a3b8">or Tailscale</text>
    <!-- server frame -->
    <rect x="300" y="20" width="880" height="380" rx="18" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="1160" y="388" font-size="15" fill="#64748b" text-anchor="end">your server</text>
    <!-- compose frame -->
    <rect x="320" y="40" width="560" height="340" rx="16" fill="#111a2e" fill-opacity=".6" stroke="#a78bfa" stroke-width="2"/>
    <text x="342" y="68" font-size="16" font-weight="600" fill="#c4b5fd" text-anchor="start">Docker Compose · own network and volumes</text>
    <!-- app -->
    <rect x="334" y="150" width="230" height="120" rx="16" fill="#1a1430" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="449" y="198" font-size="26" font-weight="800" fill="#f1f5f9">app</text>
    <text x="449" y="226" font-size="16" fill="#c4b5fd">FastAPI + React</text>
    <text x="449" y="248" font-size="16" fill="#c4b5fd">127.0.0.1 only</text>
    <!-- db + codex -->
    <path d="M566 185 C600 185 600 130 636 130" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M566 235 C600 235 600 290 636 290" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="640" y="90" width="222" height="82" rx="14" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <text x="751" y="124" font-size="21" font-weight="700" fill="#f1f5f9">PostgreSQL</text>
    <text x="751" y="152" font-size="15" fill="#94a3b8">no TCP port · Unix socket</text>
    <rect x="640" y="250" width="222" height="82" rx="14" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <text x="751" y="284" font-size="21" font-weight="700" fill="#f1f5f9">Codex</text>
    <text x="751" y="312" font-size="15" fill="#94a3b8">isolated · official app-server</text>
    <!-- host services -->
    <path d="M566 210 L970 210 Q1001 210 1001 190 L1001 176" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#a)"/>
    <path d="M970 210 Q1001 210 1001 230 L1001 246" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#a)"/>
    <text x="760" y="232" font-size="14" fill="#64748b">on the host</text>
    <rect x="900" y="90" width="202" height="82" rx="14" fill="#0b1a24" stroke="#94a3b8" stroke-width="2"/>
    <text x="1001" y="124" font-size="21" font-weight="700" fill="#f1f5f9">Ollama</text>
    <text x="1001" y="152" font-size="15" fill="#94a3b8">existing local models</text>
    <rect x="900" y="250" width="202" height="82" rx="14" fill="#0b1a24" stroke="#94a3b8" stroke-width="2"/>
    <text x="1001" y="284" font-size="21" font-weight="700" fill="#f1f5f9">Claude Code</text>
    <text x="1001" y="312" font-size="15" fill="#94a3b8">optional · no tools</text>
  </g>
</svg>
